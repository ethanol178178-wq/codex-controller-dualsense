name: 問題回報
description: 回報可重現的控制器、介面或安裝問題
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        請勿貼上本機權杖、Codex 對話內容、私人路徑或個人映射檔。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 例如 0.2.4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 使用方式
      options:
        - Windows 安裝版
        - 可攜版
        - 從原始碼執行
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: 手把與連線
      placeholder: 例如 DualSense CFI-ZCT1W，USB
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 從啟動程式開始，依序描述操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 實際結果
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 發布前確認
      options:
        - label: 我已確認使用 USB 資料線，而非僅供充電的線材。
          required: true
        - label: 我沒有在回報中放入權杖、私人內容或本機路徑。
          required: true

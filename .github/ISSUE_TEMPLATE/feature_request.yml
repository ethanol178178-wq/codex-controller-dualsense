name: 功能建議
description: 提議新的操作流程、硬體支援或介面改進
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 請先描述使用情境，而不只是解法。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 範圍確認
      options:
        - label: 這項建議與 DualSense、Windows 或 Codex 控制工作流直接相關。
          required: true

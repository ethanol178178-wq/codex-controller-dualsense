name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  build-sign-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release metadata and signing configuration
        id: release_metadata
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }

          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG',
            'SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Signed release is not configured. Missing: $($missing -join ', ')"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build unsigned portable package
        shell: pwsh
        run: .\packaging\build.ps1 -SkipInstaller -SkipFinalize

      - name: Stage portable artifact for signing
        shell: pwsh
        run: |
          $stage = 'packaging\signing-input\portable\DualSenseCodex'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path 'packaging\dist\DualSenseCodex\*' -Destination $stage -Recurse -Force

      - name: Upload unsigned portable artifact
        id: upload_portable
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-portable-${{ steps.release_metadata.outputs.version }}
          path: packaging/signing-input/portable
          if-no-files-found: error
          retention-days: 1

      - name: Sign portable executable
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_portable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: packaging/signing-output/portable
          parameters: |
            version: ${{ toJSON(steps.release_metadata.outputs.version) }}

      - name: Verify and adopt signed portable executable
        shell: pwsh
        run: |
          $matches = @(Get-ChildItem -LiteralPath 'packaging\signing-output\portable' -Filter 'DualSenseCodex.exe' -File -Recurse)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one signed DualSenseCodex.exe, found $($matches.Count)."
          }
          .\packaging\verify-signatures.ps1 -Path $matches[0].FullName
          Copy-Item -LiteralPath $matches[0].FullName -Destination 'packaging\dist\DualSenseCodex\DualSenseCodex.exe' -Force

      - name: Build installer from signed portable files
        shell: pwsh
        run: .\packaging\build-installer.ps1 -Version '${{ steps.release_metadata.outputs.version }}'

      - name: Stage installer for signing
        shell: pwsh
        run: |
          $stage = 'packaging\signing-input\installer'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath 'packaging\output\DualSense-Codex-Setup-${{ steps.release_metadata.outputs.version }}.exe' -Destination $stage -Force

      - name: Upload unsigned installer artifact
        id: upload_installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer-${{ steps.release_metadata.outputs.version }}
          path: packaging/signing-input/installer
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: packaging/signing-output/installer
          parameters: |
            version: ${{ toJSON(steps.release_metadata.outputs.version) }}

      - name: Verify signed release files
        shell: pwsh
        run: |
          $version = '${{ steps.release_metadata.outputs.version }}'
          $matches = @(Get-ChildItem -LiteralPath 'packaging\signing-output\installer' -Filter "DualSense-Codex-Setup-$version.exe" -File -Recurse)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one signed installer, found $($matches.Count)."
          }
          $installer = "packaging\output\DualSense-Codex-Setup-$version.exe"
          Copy-Item -LiteralPath $matches[0].FullName -Destination $installer -Force
          .\packaging\verify-signatures.ps1 -Path @(
            'packaging\dist\DualSenseCodex\DualSenseCodex.exe',
            $installer
          )

      - name: Finalize signed release packages
        shell: pwsh
        run: .\packaging\finalize-release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.release_metadata.outputs.version }}'
          gh release create "v$version" `
            "packaging\DualSense-Codex-Portable-$version.zip" `
            "packaging\output\DualSense-Codex-Setup-$version.exe" `
            "packaging\SHA256SUMS-$version.txt" `
            --title "Codex Controller for DualSense $version" `
            --notes-file RELEASE_NOTES.md `
            --prerelease
